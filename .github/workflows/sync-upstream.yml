name: Sync with Upstream Homepage

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: latest
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/gethomepage/homepage.git || true
          git fetch upstream

      - name: Merge upstream changes
        id: merge
        run: |
          # Store the current HEAD
          BEFORE_MERGE=$(git rev-parse HEAD)

          # Try to merge upstream/dev into our branch
          if ! git merge upstream/dev --no-edit; then
            # Handle conflicts
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

            # Always keep our versions of these files
            echo "$CONFLICTED_FILES" | grep -E "^README.md$|^.github/workflows/" | while read -r file; do
              if [ -f "$file" ]; then
                echo "Keeping our version of $file"
                git checkout --ours "$file"
                git add "$file"
              fi
            done

            # Check if there are other conflicts remaining
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Other conflicts detected beyond README.md and workflows"
              echo "merge_conflict=true" >> $GITHUB_OUTPUT
              exit 1
            fi

            # Complete the merge
            git commit --no-edit
          fi

          # After merge, check if any workflow files were modified and revert them
          if git diff --name-only $BEFORE_MERGE HEAD | grep -q "^.github/workflows/"; then
            echo "Workflow files were modified, reverting to our versions"
            git checkout $BEFORE_MERGE -- .github/workflows/
            git commit --amend --no-edit
          fi

      - name: Push changes
        if: steps.merge.outcome == 'success'
        run: |
          git push origin latest

      - name: Create issue on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync conflict detected',
              body: 'The automated sync from gethomepage/homepage encountered merge conflicts. Manual resolution required.\n\nRun locally:\n```bash\ngit fetch upstream\ngit merge upstream/dev\n# Resolve conflicts\ngit push origin feat/snowflake-widget\n```',
              labels: ['sync-conflict']
            })
